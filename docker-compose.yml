version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=smart_healthcare_super_secret_jwt_key_2026
      - DATABASE_URL=postgresql://carequeue:carequeue123@postgres:5432/carequeuedb?schema=public
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: carequeue-postgres
    environment:
      POSTGRES_USER: carequeue
      POSTGRES_PASSWORD: carequeue123
      POSTGRES_DB: carequeuedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
